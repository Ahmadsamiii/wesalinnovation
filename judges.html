<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسئلة التحكيم | وصال</title>
<meta name="description" content="أسئلة لجنة التحكيم المتوقعة وأجوبتها لفريق وصال، بالعربي والإنجليزي.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#282692">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="preload" href="/fonts/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/thmanyahsans-Bold.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* يُطبَّق المظهر المحفوظ قبل أول رسم حتى لا تومض الألوان */
try{var t=localStorage.getItem('jd-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);var l=localStorage.getItem('jd-lang');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}
</script>
<style>
/* هوية وصال: القيم من دليل الهوية البصرية ومنسوخة من homepage/assets/home.css حتى تبقى الصفحات تجربة واحدة */
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Bold.woff2') format('woff2');font-weight:600 700;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Black.woff2') format('woff2');font-weight:800 900;font-style:normal;font-display:swap}
:root{--primary:#282692;--secondary:#814fc3;--tertiary:#5039a8;--navy:#20134f;--blue:#3e9eed;--sky:#52bdf9;
--bg:#f8f6fd;--surface:#fff;--alt:#f1eef8;--line:#e4ddf0;--muted:#5f5480;--text:#3d3558;--ink:#1a1632;--accent:#6b3fb0;
--warn-bg:#fff4d9;--warn-line:#e2b94a;--warn-ink:#6d4300;--hard-bg:#efe6fb;--hard-ink:#4d2491;--hot-bg:#e3f2fe;--hot-ink:#0b4f8a;--ok:#0b6b4d;--ask-bg:#ffedd5;--ask-line:#e8963a;--ask-ink:#7a3a00;
--g-brand:linear-gradient(135deg,#814fc3 0%,#5039a8 40%,#282692 100%);
--g-hero:linear-gradient(160deg,#12103a 0%,#1a1560 20%,#282892 45%,#4a35a8 70%,#6b42bc 85%,#814fc3 100%);
--sh:0 1px 2px rgba(40,38,146,.05),0 8px 24px -8px rgba(40,38,146,.12);--sh-lg:0 2px 4px rgba(40,38,146,.05),0 18px 44px -12px rgba(40,38,146,.28);
--r:16px;--gut:clamp(16px,4vw,32px);--ease:cubic-bezier(.4,0,.2,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0d1a;--surface:#1a1730;--alt:#151228;--line:#2d2950;--muted:#a698c9;--text:#c8bfe0;--ink:#f0ecf8;--accent:#b99af0;--warn-bg:#33270a;--warn-line:#7a5a12;--warn-ink:#ffd98a;--hard-bg:#2b2150;--hard-ink:#d6c2ff;--hot-bg:#10304a;--hot-ink:#8fd2ff;--ok:#6ee7b7;--ask-bg:#3b2509;--ask-line:#a8651b;--ask-ink:#ffcf8a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);--sh-lg:0 2px 4px rgba(0,0,0,.4),0 18px 44px -12px rgba(0,0,0,.7)}}
:root[data-theme=dark]{--bg:#0f0d1a;--surface:#1a1730;--alt:#151228;--line:#2d2950;--muted:#a698c9;--text:#c8bfe0;--ink:#f0ecf8;--accent:#b99af0;--warn-bg:#33270a;--warn-line:#7a5a12;--warn-ink:#ffd98a;--hard-bg:#2b2150;--hard-ink:#d6c2ff;--hot-bg:#10304a;--hot-ink:#8fd2ff;--ok:#6ee7b7;--ask-bg:#3b2509;--ask-line:#a8651b;--ask-ink:#ffcf8a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);--sh-lg:0 2px 4px rgba(0,0,0,.4),0 18px 44px -12px rgba(0,0,0,.7)}
@media(prefers-contrast:more){:root{--line:#5a4f7a;--muted:#3d3558}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:150px}
body{min-height:100vh;font-family:'Thmanyah Sans','Segoe UI',system-ui,sans-serif;font-size:1.0625rem;line-height:1.85;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{color:var(--ink);line-height:1.4}
a{color:var(--primary);font-weight:600}
[data-theme=dark] a,:root:not([data-theme=light]) a{color:inherit}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]) a{color:var(--primary)}}
:root[data-theme=dark] a{color:#c9b6f5}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) a{color:#c9b6f5}}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;top:-100%;inset-inline-start:16px;background:var(--primary);color:#fff!important;padding:10px 18px;border-radius:0 0 10px 10px;z-index:99;text-decoration:none}.skip:focus{top:0}
.ico{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
[dir=rtl] .flip{transform:scaleX(-1)}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:var(--gut)}

/* الرأس */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px}
.brand{display:flex;align-items:center;flex:none;margin-inline-end:auto}
.brand img{height:36px;width:auto;display:block}
.brand .lw{display:none}
:root[data-theme=dark] .brand .lc{display:none}:root[data-theme=dark] .brand .lw{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .brand .lc{display:none}:root:not([data-theme=light]) .brand .lw{display:block}}
.nav{order:3;flex:1 1 100%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.nav::-webkit-scrollbar{display:none}
.nav a,.nav button,.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid transparent;border-radius:999px;background:transparent;color:var(--text)!important;font:inherit;font-size:.95rem;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.nav a:hover,.nav button:hover,.tbtn:hover{background:var(--alt)}
.nav a[aria-current=page]{background:var(--alt);color:var(--accent)!important;border-color:var(--line)}
.tools{display:flex;gap:4px}
.tbtn{border-color:var(--line);padding:0 12px}
@media(min-width:900px){.nav{order:0;flex:0 1 auto;margin-inline:auto 0}.brand{margin-inline-end:8px}.nav{margin-inline-end:auto}}
@media(max-width:639px){
  body{padding-bottom:78px}
  .nav{position:fixed;inset-inline:0;bottom:0;z-index:40;order:0;flex:none;justify-content:space-around;gap:2px;overflow:visible;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -10px rgba(40,38,146,.25)}
  .nav a,.nav button{flex:1 1 0;flex-direction:column;justify-content:center;gap:2px;min-width:0;min-height:52px;padding:4px 2px;border-radius:12px;font-size:.74rem;line-height:1.35;text-align:center;white-space:normal}
  .nav .ico{width:1.45em;height:1.45em}
  .toast{bottom:92px}
  .chip:nth-child(n+6){display:none}
}

/* البطل والبحث */
.hero{position:relative;overflow:hidden;color:#fff;background:var(--g-hero);padding:clamp(34px,7vw,72px) 0 clamp(28px,5vw,48px)}
.hero .arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.hero .wrap{position:relative}
.hero h1{color:#fff;font-weight:900;font-size:clamp(2rem,5.4vw,3.6rem);letter-spacing:0}
.hero p.lead{margin-top:10px;max-width:46ch;color:rgba(255,255,255,.9);font-size:clamp(1rem,2vw,1.2rem)}
.sform{margin-top:26px;max-width:720px}
.sbox{position:relative;display:flex;align-items:center;background:var(--surface);border:2px solid transparent;border-radius:999px;box-shadow:var(--sh-lg)}
.sbox:focus-within{border-color:var(--sky)}
.sbox>.ico{position:absolute;inset-inline-start:20px;width:1.4em;height:1.4em;color:var(--muted);pointer-events:none}
.sbox input{width:100%;min-height:58px;padding:6px 56px 6px 110px;padding-inline:56px 110px;font:inherit;font-size:1.1rem;line-height:2;color:var(--ink);background:transparent;border:0;border-radius:999px;outline:0}
.sbox input::placeholder{color:var(--muted);opacity:1}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .sx{position:absolute;inset-inline-end:54px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.sbox kbd{position:absolute;inset-inline-end:16px;min-width:28px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--alt);color:var(--muted);font:inherit;font-size:.85rem;text-align:center;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:4px 16px;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.12);color:#fff!important;font:inherit;font-size:.95rem;font-weight:600;text-decoration:none;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.22)}
body:not([data-view=home]) .hero{padding:16px 0}
body:not([data-view=home]) .hero h1,body:not([data-view=home]) .hero p.lead,body:not([data-view=home]) .hero .chips{display:none}
body:not([data-view=home]) .sform{margin-top:0}
body:not([data-view=home]) .sbox input{min-height:50px}

/* الصفحة */
main{padding-block:clamp(24px,4vw,44px) 64px;outline:0}
[tabindex="-1"]:focus-visible,main:focus-visible{outline:0}
main h1.vt{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:800}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:.92rem;color:var(--muted)}
.crumb a{font-weight:500}
.vsub{margin-top:6px;color:var(--muted);max-width:62ch}
.sec{margin-top:clamp(28px,5vw,48px)}
.sec>h2{font-size:1.35rem;font-weight:800;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.cgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.ccard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 16px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);text-decoration:none;color:inherit!important;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--secondary)}
.cic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--g-brand);font-size:1.4rem}
.ccard .cb{min-width:0}
.ccard h3{font-size:1.1rem;font-weight:800}
.ccard p{color:var(--muted);font-size:.93rem;line-height:1.7}
.ccard .cn{display:block;margin-top:4px;color:var(--accent);font-weight:700;font-size:.9rem}
.ccard>.ico{color:var(--accent)}
.tcard{display:flex;gap:14px;align-items:flex-start;padding:18px;background:var(--alt);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit!important;font:inherit;text-align:start;cursor:pointer;width:100%}
.tcard:hover{border-color:var(--secondary)}
.tcard .cic{width:42px;height:42px;font-size:1.2rem;flex:none}
.tcard b{display:block;color:var(--ink);font-size:1.02rem}
.tcard .tb{display:block;min-width:0}
.tcard .td{display:block;color:var(--muted);font-size:.93rem;line-height:1.7}
.tcard .cic{color:#fff}
.note{display:flex;gap:12px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--secondary);border-radius:var(--r);font-size:.97rem}
.note ul{margin:6px 0 0;padding-inline-start:20px}
.note li{margin-top:3px}

/* شريط الأدوات في القوائم */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 14px}
.fchip,.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text)!important;font:inherit;font-size:.94rem;font-weight:600;text-decoration:none;cursor:pointer}
.fchip:hover,.btn:hover{border-color:var(--secondary)}
.fchip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff!important}
:root[data-theme=dark] .fchip[aria-pressed=true]{background:var(--tertiary);border-color:var(--tertiary)}
.btn.main{background:var(--g-brand);border-color:transparent;color:#fff!important;box-shadow:0 8px 22px rgba(80,57,168,.3)}
.btn.sm{min-height:40px;font-size:.9rem;padding:0 14px}
.btn[disabled]{opacity:.55;cursor:default}
.sp{flex:1}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:.94rem;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--primary)}

/* السؤال */
.qs{display:grid;gap:10px}
details.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
details.q[open]{border-color:var(--secondary)}
details.q>summary{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;cursor:pointer;list-style:none;min-height:56px}
details.q>summary::-webkit-details-marker{display:none}
.qt{flex:1;font-weight:700;color:var(--ink);font-size:1.06rem;line-height:1.7}
.q2{display:block;margin-top:2px;font-weight:500;font-size:.95rem;color:var(--muted)}
.bdg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;max-width:46%}
.bg{display:inline-flex;align-items:center;gap:5px;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:700;line-height:1.8;white-space:nowrap}
.bg.hot{background:var(--hot-bg);color:var(--hot-ink)}
.bg.hard{background:var(--hard-bg);color:var(--hard-ink)}
.bg.vf{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.askbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;flex:none}
.askbtn:hover{border-color:var(--ask-line);color:var(--ask-ink)}
.askbtn.on{background:var(--ask-bg);border-color:var(--ask-line);color:var(--ask-ink)}
.askn{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--ask-ink);color:var(--ask-bg);font-size:.85rem;font-weight:800;line-height:1}
.aklist{display:grid;gap:8px}
.akrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit!important;text-decoration:none;font-weight:600}
.akrow:hover{border-color:var(--ask-line)}
.akn{display:grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--ask-bg);color:var(--ask-ink);border:1px solid var(--ask-line);font-weight:900}
.akrow small{color:var(--muted);font-weight:500}
.askhome{margin-bottom:34px}
.askhome>h2{display:flex;align-items:center;gap:10px}
.tundo{margin-inline-start:14px;min-height:32px;padding:0 6px;border:0;background:transparent;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer}
.chev{margin-top:.35em;color:var(--muted);transition:transform .2s var(--ease)}
details[open]>summary>.chev{transform:rotate(180deg)}
@media(max-width:640px){details.q>summary{flex-wrap:wrap}.bdg{max-width:none;order:3;flex-basis:100%;justify-content:flex-start}.chev{order:2}.askbtn{order:1}.askt{display:none}}
.qb{padding:0 18px 18px;border-top:1px solid var(--line)}
.ans{padding-top:14px}
.ans+.ans{margin-top:14px;border-top:1px dashed var(--line)}
.ans .lbl,.mt dt{font-size:.8rem;font-weight:800;letter-spacing:0;color:var(--accent);margin-bottom:4px}
.short p,.det p{margin:0 0 .6em}
.short{font-size:1.04rem;color:var(--ink)}
.ans ul{margin:.3em 0 .6em;padding-inline-start:22px}
.ans li{margin:.2em 0}
.more{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--alt)}
.more>summary{padding:8px 14px;min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:.93rem;color:var(--accent);list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:'+';font-weight:800;width:1em;text-align:center}
.more[open]>summary::before{content:'\2212'}
.det{padding:2px 14px 10px;font-size:.99rem}
.mt{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mt dd{font-size:.95rem;line-height:1.7}
.mt dd small{display:block;color:var(--muted)}
.verify{margin-top:14px;padding:12px 14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;color:var(--warn-ink);font-size:.95rem}
.verify strong{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
mark{background:#ffe27a;color:#1a1632;border-radius:4px;padding:0 2px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.cg{margin-top:26px}
.cg h2{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cg h2 .cic{width:34px;height:34px;font-size:1rem;border-radius:10px}
.num{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:var(--alt);color:var(--accent);font-weight:800;font-size:.9rem;margin-inline-end:8px}

/* أرقام للحفظ */
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.fact{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.fact b{display:block;font-size:1.55rem;font-weight:900;color:var(--accent);line-height:1.3;direction:ltr;text-align:start}
[dir=rtl] .fact b{text-align:right}
.fact span{display:block;margin-top:2px;font-size:.92rem;color:var(--text);line-height:1.6}
.fact small{display:block;margin-top:6px;color:var(--muted);font-size:.8rem}

/* التدريب */
.tr{max-width:820px;margin-inline:auto;padding:clamp(20px,4vw,34px);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-lg)}
.tr .tq{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;color:var(--ink);line-height:1.6;outline:0}
.tr .tq2{margin-top:6px;color:var(--muted)}
.tr .tans{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);outline:0}
.prog{height:8px;border-radius:99px;background:var(--alt);overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--g-brand);border-radius:99px}
.tstat{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:600;font-size:.95rem}
select,.sel{min-height:44px;padding:0 14px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px}

/* وضع العرض */
body.presenting .top,body.presenting .hero,body.presenting .foot{display:none}
body.presenting{background:#12103a}
body.presenting main{position:fixed;inset:0;overflow:auto;max-width:none;margin:0;padding:0;background:var(--g-hero);color:#fff}
.pres{min-height:100%;display:flex;flex-direction:column;padding:clamp(16px,3vw,32px);--pfs:1}
.pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem;color:rgba(255,255,255,.88)}
.pb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.1);color:#fff!important;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none}
.pb:hover{background:rgba(255,255,255,.22)}
.pb.solid{background:#fff;border-color:#fff;color:#282692!important}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;width:100%;max-width:1100px;margin:0 auto;padding-block:24px}
.pq{color:#fff;font-weight:900;font-size:calc(clamp(1.8rem,4.8vw,3.6rem)*var(--pfs));line-height:1.5;outline:0}
.pq2{color:rgba(255,255,255,.8);font-size:calc(clamp(1.1rem,2.4vw,1.7rem)*var(--pfs));margin-top:10px;font-weight:500}
.pcard{padding:clamp(16px,3vw,28px);background:var(--surface);color:var(--ink);border-radius:20px;font-size:calc(clamp(1.1rem,2.3vw,1.7rem)*var(--pfs));line-height:1.8;outline:0}
.pcard .lbl{font-size:.7em}
.pcard .short{font-size:1em}
.pcard .det{padding:0;font-size:.86em;color:var(--text)}
.pcard .ans+.ans{margin-top:18px}
.pcard .more{display:none}
.pfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* الذيل */
.foot{margin-top:40px;background:var(--navy);color:#e6def6}
.foot .wrap{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));padding-block:36px}
.foot h2{font-size:1rem;color:#fff;margin-bottom:8px}
.foot p,.foot li{font-size:.94rem;line-height:1.9}
.foot ul{list-style:none}
.foot a{color:#c9b6f5!important;font-weight:500}
.foot .soc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foot .soc a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.3);border-radius:999px;text-decoration:none;color:#fff!important}
.foot .legal{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;font-size:.88rem;color:#b9aedb}
[dir=rtl] .ltr,.ltr{direction:ltr;unicode-bidi:isolate}

/* نافذة الطباعة */
dialog{width:min(520px,calc(100% - 32px));margin:auto;padding:0;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--text);box-shadow:var(--sh-lg)}
dialog::backdrop{background:rgba(18,16,58,.6)}
dialog form{padding:22px;display:grid;gap:14px}
dialog h2{font-size:1.25rem}
dialog label.f{display:grid;gap:4px;font-weight:700;font-size:.93rem;color:var(--ink)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;inset-inline:16px;bottom:20px;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:var(--sh-lg);z-index:80}
#printRoot{display:none}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* الطباعة: ورق وصال الرسمي */
@page{size:A4;margin:0}

  html{background:#fff!important}
  html,body{color:#1a1632!important;font-size:10.5pt;line-height:1.75;margin:0;padding:0}
  body{background:transparent!important}
  body{min-height:0!important;padding-bottom:0!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

}
</style>

function TL(l,k){return UI[l][k]}

function arCount(n,one,two,few,many){return n===1?one:n===2?two:(n>=3&&n<=10)?n+' '+few:n+' '+many}

function rCount(n){if(state.lang!=='ar')return n===0?'No results':n+(n===1?' result':' results');return n===0?'لا نتائج':arCount(n,'نتيجة واحدة','نتيجتان','نتائج','نتيجة')}

/* ------------------------------------------------------------ أدوات */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[^ء-يa-z0-9%.]+/g,' ').replace(/\s+/g,' ').trim()}
function tokens(q){return norm(q).split(' ').filter(Boolean).map(function(w){return w.length>3&&w.indexOf('ال')===0?w.slice(2):w})}
function hlRe(tk){
  if(!tk.length)return null;
  var map={'ا':'[اأإآٱ]','ي':'[يىئ]','ه':'[هة]','و':'[وؤ]'};
  var parts=tk.map(function(w){return w.split('').map(function(ch){var b=map[ch]||ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return b+'[\\u064B-\\u065F\\u0670\\u0640]*'}).join('')});
  try{return new RegExp('('+parts.join('|')+')','gi')}catch(e){return null}
}
function hl(text,re){
  text=String(text);
  if(!re)return esc(text);
  var out='',last=0,m;re.lastIndex=0;
  while((m=re.exec(text))){if(!m[0]){re.lastIndex++;continue}out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';last=m.index+m[0].length}
  return out+esc(text.slice(last));
}
function para(text,re){
  var h='',ul=[];
  function flush(){if(ul.length){h+='<ul>'+ul.map(function(x){return '<li>'+hl(x,re)+'</li>'}).join('')+'</ul>';ul=[]}}
  String(text).split('\n').forEach(function(l){
    if(l.indexOf('• ')===0)ul.push(l.slice(2));
    else{flush();if(l.trim())h+='<p>'+hl(l,re)+'</p>'}
  });
  flush();return h;
}
function ic(id,cls){return '<svg class="ico'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+id+'"/></svg>'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function say(msg){var l=document.getElementById('live');l.textContent='';setTimeout(function(){l.textContent=msg},30)}
var toastT;
function toast(msg,undo){
  var t=document.getElementById('toast');t.textContent='';
  var sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  if(undo){var b=document.createElement('button');b.type='button';b.className='tundo';b.textContent=T('undo');b.addEventListener('click',function(){t.hidden=true;undo()});t.appendChild(b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},undo?5000:2200);say(msg);
}
function langAttrs(i){return i===0?' lang="ar" dir="rtl"':' lang="en" dir="ltr"'}
function clusterOf(id){for(var i=0;i<D.clusters.length;i++)if(D.clusters[i].id===id)return D.clusters[i]}
function srcLabels(it,i){return it.src.map(function(k){return D.sources[k]?D.sources[k][i]:k}).join(i===0?'، ':', ')}
function whoOf(it,i){var w=D.team[it.who];return w?{n:w.name[i],r:w.role[i]}:null}

/* ------------------------------------------------------------ فهرسة */
/* ملاحظات الفريق الداخلية في ملف خاص لا يدخل Git. بغيابه تعمل الصفحة بلا عناصر «التأكيد» */
var NOTES=window.JUDGES_NOTES||{};
var HAS_NOTES=false;
D.items.forEach(function(it){
  it.v=NOTES[it.id]||null;if(it.v)HAS_NOTES=true;
  byId[it.id]=it;(byC[it.c]=byC[it.c]||[]).push(it);
  var w=D.team[it.who];
  it._n={q:norm(it.q[0]+' '+it.q[1]),s:norm(it.s[0]+' '+it.s[1]),d:norm(it.d?it.d[0]+' '+it.d[1]:''),
    k:norm(it.k+' '+(w?w.name[0]+' '+w.name[1]:'')+' '+clusterOf(it.c).t[0]+' '+clusterOf(it.c).t[1])};
  if(it.hot)HOT.push(it);
});
HOT.sort(function(a,b){return a.hot-b.hot});
function searchItems(q){
  var tk=tokens(q),hits=[],near=[];
  if(!tk.length)return{tk:tk,hits:hits,near:near};
  D.items.forEach(function(it){
    var n=it._n,score=0,matched=0;
    tk.forEach(function(w){var sc=0;if(n.q.indexOf(w)>-1)sc=5;else if(n.k.indexOf(w)>-1)sc=3;else if(n.s.indexOf(w)>-1)sc=2;else if(n.d.indexOf(w)>-1)sc=1;if(sc){matched++;score+=sc}});
    if(matched===tk.length)hits.push({it:it,score:score+(it.hot?1:0)});
    else if(matched>0)near.push({it:it,score:score+matched*10});
  });
  hits.sort(function(a,b){return b.score-a.score});near.sort(function(a,b){return b.score-a.score});
  return{tk:tk,hits:hits.map(function(x){return x.it}),near:near.slice(0,6).map(function(x){return x.it})};
}

/* ------------------------------------------------------------ سؤال مكرر: عدّاد الأسئلة اللي تكرر سؤالها من اللجنة
   كل ضغطة تزيد عدّاد السؤال واحداً، والأعلى عدداً يطلع أول القوائم وأعلى الرئيسية.
   محلي في متصفح كل عضو (localStorage)، ويُدمج بين الأجهزة برابط يحمل القائمة. */
var asked=(function(){try{var o=JSON.parse(store.get('jd-asked','{}'));return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch(e){return{}}})();
function askN(id){var a=asked[id];return a&&a.n>0?a.n:0}
function askSave(){store.set('jd-asked',JSON.stringify(asked));syncAskedBtn()}
function askSet(id,n){if(!byId[id])return;if(n<=0)delete asked[id];else asked[id]={n:Math.min(n,99),t:Date.now()};askSave()}
function askDistinct(){var c=0;for(var id in asked){if(byId[id]&&askN(id))c++}return c}
function sortByAsk(list){
  var a=[],r=[];list.forEach(function(it){(askN(it.id)?a:r).push(it)});
  a.sort(function(x,y){return askN(y.id)-askN(x.id)||asked[y.id].t-asked[x.id].t});
  return a.concat(r);
}
function askedList(){return sortByAsk(D.items).filter(function(it){return askN(it.id)})}
function syncAskedBtn(){
  var b=document.getElementById('askedBtn');if(!b)return;
  var n=askDistinct();b.hidden=!n;document.getElementById('askedN').textContent=n;
  b.setAttribute('aria-label',T('asked_t')+': '+n);
}
function askBtn(it){
  var n=askN(it.id);
  return '<button type="button" class="askbtn'+(n?' on':'')+'" data-ask="'+it.id+'" title="'+esc(T('ask_aria'))+'" aria-label="'+esc(T('ask_aria')+(n?'، '+T('ask_cur')+' '+n:''))+'">'+ic('tally')+'<span class="askt">'+esc(T('ask'))+'</span>'+(n?'<span class="askn">'+n+'</span>':'')+'</button>';
}
function askTools(it){
  if(!askN(it.id))return '';
  return '<button type="button" class="btn sm" data-act="askminus" data-id="'+it.id+'">'+esc(T('askminus'))+'</button><button type="button" class="btn sm" data-act="askreset" data-id="'+it.id+'">'+esc(T('askreset'))+'</button>';
}
function askRerender(id){
  var open=[],ds=main.querySelectorAll('details.q[open]');for(var i=0;i<ds.length;i++)open.push(ds[i].getAttribute('data-id'));
  var fl=main.querySelector('[data-filter][aria-pressed=true]');
  route2(open,fl&&fl.getAttribute('data-filter'));
  var el=id&&document.getElementById('q-'+id);
  if(el){window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.scrollY-150));var b=el.querySelector('[data-ask]');if(b)b.focus({preventScroll:true})}
}
function askPress(id){
  var n=askN(id)+1;askSet(id,n);askRerender(id);
  toast(T('ask_done')+': '+n,function(){askSet(id,n-1);askRerender(id)});
}
function askShareLink(){return location.origin+location.pathname+'#/import/'+askedList().map(function(it){return it.id+'.'+askN(it.id)}).join(',')}
var pendingImport=[];
function askMerge(){
  var ch=0;pendingImport.forEach(function(x){if(x.n>askN(x.id)){askSet(x.id,x.n);ch++}});
  toast(T('merged')+' ('+ch+')');location.hash='#/asked';
}
function askedSectionHTML(){
  var list=askedList();if(!list.length)return '';
  var L=LI(),h='<section class="sec askhome" aria-labelledby="akT" style="margin-top:0"><h2 id="akT">'+ic('tally')+esc(T('asked_t'))+' ('+list.length+')</h2><div class="aklist">';
  list.slice(0,8).forEach(function(it){h+='<a class="akrow" href="#/q/'+it.id+'"><span class="akn">'+askN(it.id)+'</span><span'+langAttrs(L)+'>'+esc(it.q[L])+'</span><small>'+esc(clusterOf(it.c).t[L])+'</small></a>'});
  h+='</div><div class="acts"><a class="btn sm main" href="#/asked">'+esc(T('asked_all'))+'</a><a class="btn sm" href="#/present/asked/0">'+ic('play')+esc(T('pres'))+'</a></div></section>';

}
function viewAsked(){
  setView('asked',T('asked_t'));
  var list=askedList(),h=crumbs([T('asked_t')]);
  h+='<h1 class="vt" tabindex="-1" id="vt">'+esc(T('asked_t'))+'</h1><p class="vsub">'+esc(T('asked_sub'))+'</p>';
  if(!list.length){h+='<div class="empty" style="margin-top:18px">'+esc(T('asked_empty'))+'</div>';main.innerHTML=h;return null}
  h+='<div class="bar"><a class="btn main" href="#/present/asked/0">'+ic('play')+esc(T('pres'))+'</a><button type="button" class="btn" data-act="asksharelink">'+ic('copy')+esc(T('share'))+'</button><button type="button" class="btn" data-act="askclear">'+esc(T('clear_asked'))+'</button><span class="sp"></span><label class="chk"><input type="checkbox" id="biChk"'+(state.bi?' checked':'')+'>'+esc(T('both'))+'</label></div>';

function viewImport(code){
  setView('import',T('import_t'));
  var items=[];String(code||'').split(',').forEach(function(x){var m=/^([a-z]+\d+)\.(\d{1,2})$/.exec(x);if(m&&byId[m[1]])items.push({id:m[1],n:Math.min(99,parseInt(m[2],10))})});
  pendingImport=items;
  var L=LI(),h=crumbs([T('import_t')])+'<h1 class="vt" tabindex="-1" id="vt">'+esc(T('import_t'))+'</h1>';
  if(!items.length){h+='<div class="empty" style="margin-top:18px">'+esc(T('import_bad'))+'</div>'}
  else{
    h+='<p class="vsub">'+esc(T('import_msg').replace('{n}',items.length))+'</p><div class="aklist" style="margin-top:14px">'+items.map(function(x){return '<div class="akrow"><span class="akn">'+x.n+'</span><span'+langAttrs(L)+'>'+esc(byId[x.id].q[L])+'</span><small></small></div>'}).join('')+'</div>';
    h+='<div class="acts"><button type="button" class="btn main" data-act="askmerge">'+esc(T('merge'))+'</button><a class="btn" href="#/">'+esc(T('ignore'))+'</a></div>';
  }
  main.innerHTML=h;return null;
}

/* ------------------------------------------------------------ عناصر مشتركة */
function badges(it){
  var h='';
  if(it.hot)h+='<span class="bg hot">'+ic('star')+esc(T('hot'))+'</span>';
  if(it.hard)h+='<span class="bg hard">'+ic('bolt')+esc(T('hard'))+'</span>';
  if(it.v)h+='<span class="bg vf">'+ic('alert')+esc(T('verify'))+'</span>';
  return h;
}
function ansBlock(it,i,re,full){
  var d=it.d?'<details class="more"><summary>'+esc(TL(i===0?'ar':'en','detail'))+'</summary><div class="det">'+para(it.d[i],re)+'</div></details>':'';
  return '<section class="ans"'+langAttrs(i)+'><h4 class="lbl">'+esc(TL(i===0?'ar':'en','short'))+'</h4><div class="short">'+para(it.s[i],re)+'</div>'+d+'</section>';
}
function itemHTML(it,o){
  o=o||{};var L=LI(),O=1-L,re=o.re||null,cl=clusterOf(it.c);
  var langs=state.bi?[L,O]:[L];
  var h='<details class="q" id="q-'+it.id+'" data-id="'+it.id+'" data-hot="'+(it.hot?1:0)+'" data-hard="'+it.hard+'" data-v="'+(it.v?1:0)+'" data-asked="'+(askN(it.id)?1:0)+'"'+(o.open?' open':'')+'>';
  h+='<summary><span class="qt">'+(o.num?'<span class="num">'+o.num+'</span>':'')+'<span'+langAttrs(L)+'>'+hl(it.q[L],re)+'</span>'+(state.bi?'<span class="q2"'+langAttrs(O)+'>'+hl(it.q[O],re)+'</span>':'')+'</span><span class="bdg">'+badges(it)+'</span>'+askBtn(it)+ic('chev','chev')+'</summary>';
  h+='<div class="qb">';
  langs.forEach(function(i){h+=ansBlock(it,i,re)});
  var w=whoOf(it,L);
  h+='<dl class="mt">';
  if(w)h+='<div><dt>'+esc(T('who'))+'</dt><dd>'+esc(w.n)+'<small>'+esc(w.r)+'</small></dd></div>';

var train={scope:'all',only:false,queue:[],cur:null,rev:false};
function prog(){try{return JSON.parse(store.get('jd-prog','{}'))||{}}catch(e){return{}}}

function inTrainScope(it){return train.scope==='all'||(train.scope==='asked'?askN(it.id)>0:it.c===train.scope)}
function trainPool(){
  var p=prog();
  return D.items.filter(function(it){return inTrainScope(it)&&(!train.only||p[it.id]!==1)});
}
function trainNext(){
  var pool=trainPool();
  if(!pool.length){train.cur=null;return}
  train.queue=train.queue.filter(function(id){return pool.some(function(it){return it.id===id})});
  if(!train.queue.length)train.queue=shuffle(pool.map(function(it){return it.id}));
  var prev=train.cur&&train.cur.id;
  var id=train.queue.pop();
  if(id===prev&&train.queue.length)id=train.queue.pop();
  train.cur=byId[id];train.rev=false;
}
function viewTrain(){
  setView('train',T('train_t'));
  if(!train.cur)trainNext();
  renderTrain();return null;
}

function parse(){return location.hash.replace(/^#\/?/,'').split('/').map(function(s){try{return decodeURIComponent(s)}catch(e){return s}})}
var lastSearchTyping=false;
function route(){
  var p=parse(),r=null,input=document.getElementById('q');
  switch(p[0]){
    case 'c':r=viewCluster(p[1]);break;
    case 'q':r=viewQuestion(p[1]);break;
    case 'search':r=viewSearch(p.slice(1).join('/'));break;
    case 'faq':r=viewFaq();break;
    case 'asked':r=viewAsked();break;
    case 'import':r=viewImport(p.slice(1).join('/'));break;
    case 'train':r=viewTrain();break;
    case 'present':r=viewPresent(p[1],parseInt(p[2],10)||0);break;
    case '':case undefined:r=viewHome();break;
    default:r=viewHome();
  }
  if(p[0]!=='search'){input.value='';document.getElementById('sclear').hidden=true}
  else{if(document.activeElement!==input)input.value=p.slice(1).join('/');document.getElementById('sclear').hidden=!input.value}
  if(r==='keep')return;
  if(r==='present'){var pq=document.getElementById('pq');if(pq)pq.focus({preventScroll:true});window.scrollTo(0,0);return}
  if(r==='skip')return;
  window.scrollTo(0,0);
  var f=document.getElementById('vt')||document.getElementById('main');
  if(f&&document.activeElement!==input)f.focus({preventScroll:true});
}

  h+='<table class="lhT"><thead><tr><td><div class="sp-h"></div></td></tr></thead><tbody><tr><td class="lh-body"><div class="ppage"><h1>'+esc(langs.length===2?TL('ar','print_title')+' | '+TL('en','print_title'):TL(langs[0]===0?'ar':'en','print_title'))+'</h1>';
  h+='<div class="psub">'+esc(TL(langs[0]===0?'ar':'en','print_sub'))+'. '+esc(D.project.number)+'. '+esc(TL(langs[0]===0?'ar':'en','internal'))+'.</div>';
  var n=0;
  groups.forEach(function(g,gi){
    h+='<h2'+(gi>0?' class="nb"':'')+'>'+esc(langs.length===2?g.t[0]+' | '+g.t[1]:g.t[langs[0]])+'</h2>';
    g.items.forEach(function(it,i){
      n++;
      h+='<article class="pq1">';
      langs.forEach(function(l){
        var lc=l===0?'ar':'en';
        h+='<div class="ln"'+langAttrs(l)+'>'+(l===langs[0]?'<h3>'+(i+1)+'. '+esc(it.q[l])+'</h3>':'<h3>'+esc(it.q[l])+'</h3>')+para(it.s[l],null);
        if(o.detail&&it.d)h+='<div class="dt">'+para(it.d[l],null)+'</div>';
        var w=whoOf(it,l);
        h+='<p class="pm"><span class="lb">'+esc(TL(lc,'who'))+':</span> '+(w?esc(w.n+' ('+w.r+')'):'')+(it.src.length?' &nbsp; <span class="lb">'+esc(TL(lc,'ref'))+':</span> '+esc(srcLabels(it,l)):'')+'</p>';
        if(o.verify&&it.v)h+='<div class="pv"><span class="lb">'+esc(TL(lc,'verify'))+':</span> '+esc(it.v[l])+'</div>';
        h+='</div>';
      });
      h+='</article>';
    });
  });
  h+='</div></td></tr></tbody><tfoot><tr><td><div class="sp-f"></div></td></tr></tfoot></table>';
  return h;
}
function openPrint(){
  var L=LI(),sel=document.getElementById('pScope'),p=parse(),h='<option value="all">'+esc(T('p_all'))+'</option><option value="faq">'+esc(T('p_faq'))+'</option>'+(askDistinct()?'<option value="asked">'+esc(T('asked_t'))+'</option>':'');
  if(p[0]==='c'&&clusterOf(p[1]))h+='<option value="c:'+p[1]+'">'+esc(T('p_group'))+': '+esc(clusterOf(p[1]).t[L])+'</option>';
  sel.innerHTML=h;
  document.getElementById('pLang').value=state.lang==='ar'?'ar':'en';
  document.getElementById('pVerifyRow').hidden=!HAS_NOTES;
  var d=document.getElementById('printDlg');
  if(d.showModal)d.showModal();else d.setAttribute('open','');
}
var pendingPrint=false;
function doPrint(){
  var o={scope:document.getElementById('pScope').value,lang:document.getElementById('pLang').value,detail:document.getElementById('pDetail').checked,verify:document.getElementById('pVerify').checked};
  document.getElementById('printRoot').innerHTML=buildPrint(o);
  pendingPrint=true;
  var imgs=document.querySelectorAll('#printRoot img'),left=imgs.length,fired=false;
  function go(){if(fired)return;fired=true;setTimeout(function(){window.print()},60)}
  if(!left)return go();
  for(var i=0;i<imgs.length;i++){if(imgs[i].complete){if(--left===0)go()}else{imgs[i].onload=imgs[i].onerror=function(){if(--left===0)go()}}}
  setTimeout(go,1500);
}
window.addEventListener('beforeprint',function(){
  if(!document.getElementById('printRoot').innerHTML){
    document.getElementById('printRoot').innerHTML=buildPrint({scope:'all',lang:state.lang,detail:true,verify:true});
  }
});
window.addEventListener('afterprint',function(){document.getElementById('printRoot').innerHTML='';pendingPrint=false});

/* ------------------------------------------------------------ أحداث */
var input=document.getElementById('q'),timer;
input.addEventListener('input',function(){
  document.getElementById('sclear').hidden=!input.value;
  clearTimeout(timer);
  timer=setTimeout(function(){
    var v=input.value.trim();
    if(!v){if(parse()[0]==='search')location.replace('#/');return}
    var h='#/search/'+encodeURIComponent(v);
    if(parse()[0]==='search')location.replace(h);else location.hash=h;
  },140);
});
input.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(input.value){input.value='';document.getElementById('sclear').hidden=true;if(parse()[0]==='search')location.replace('#/')}else input.blur();e.preventDefault()}
  else if(e.key==='Enter'||e.key==='ArrowDown'){var s=main.querySelector('details.q>summary');if(s){s.focus();e.preventDefault()}}
});
document.getElementById('sclear').addEventListener('click',function(){input.value='';this.hidden=true;input.focus();if(parse()[0]==='search')location.replace('#/')});
document.addEventListener('keydown',function(e){
  var tg=e.target,typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
  if(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!document.body.classList.contains('presenting')){e.preventDefault();input.focus();input.select();return}
  var v=parse()[0];
  if(v==='present'){
    var rtl=document.documentElement.dir==='rtl';
    if(e.key==='Escape'){location.hash='#/'}
    else if(e.key==='ArrowLeft'){presGo(rtl?1:-1)}else if(e.key==='ArrowRight'){presGo(rtl?-1:1)}
    else if((e.key===' '||e.key==='Enter'||e.key==='ArrowDown')&&!(tg&&(tg.tagName==='BUTTON'||tg.tagName==='A'))){e.preventDefault();presReveal()}
  }else if(v==='train'&&!typing&&!(tg&&(tg.tagName==='BUTTON'||tg.tagName==='A'))&&(e.key===' '||e.key==='Enter')){
    if(train.cur&&!train.rev){e.preventDefault();train.rev=true;renderTrain();var a=document.getElementById('tans');if(a)a.focus({preventScroll:true})}
  }
});
function copyLink(id){copyText(location.origin+location.pathname+'#/q/'+id,T('copied'))}
function copyText(url,okMsg){
  function ok(){toast(okMsg)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(ok,function(){fallback()})}else fallback();
  function fallback(){var t=document.createElement('textarea');t.value=url;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(t)}
}
function applyFilter(f){
  var list=main.querySelectorAll('details.q'),shown=0;
  for(var i=0;i<list.length;i++){
    var d=list[i],show=f==='all'||(f==='hot'&&d.getAttribute('data-hot')==='1')||(f==='hard'&&d.getAttribute('data-hard')==='1')||(f==='asked'&&d.getAttribute('data-asked')==='1')||(f==='v'&&d.getAttribute('data-v')==='1');
    d.hidden=!show;if(show)shown++;
  }
  say(qCount(shown));
}
main.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-ask],[data-copy],[data-filter],[data-act]'):null;if(!t)return;
  if(t.hasAttribute('data-ask')){e.preventDefault();e.stopPropagation();askPress(t.getAttribute('data-ask'));return}
  if(t.hasAttribute('data-copy')){copyLink(t.getAttribute('data-copy'));return}
  if(t.hasAttribute('data-filter')){
    var all=main.querySelectorAll('[data-filter]');for(var i=0;i<all.length;i++)all[i].setAttribute('aria-pressed',all[i]===t?'true':'false');
    applyFilter(t.getAttribute('data-filter'));return;
  }
  var a=t.getAttribute('data-act');
  if(a==='openall'||a==='closeall'){var ds=main.querySelectorAll('details.q:not([hidden])');for(var j=0;j<ds.length;j++)ds[j].open=a==='openall';return}
  if(a==='print'){openPrint();return}
  if(a==='askminus'){var id1=t.getAttribute('data-id');askSet(id1,askN(id1)-1);askRerender(id1);return}
  if(a==='askreset'){var id2=t.getAttribute('data-id');askSet(id2,0);askRerender(id2);return}
  if(a==='asksharelink'){copyText(askShareLink(),T('share_ok'));return}
  if(a==='askclear'){if(window.confirm(T('clear_q'))){asked={};askSave();route_noscroll()}return}
  if(a==='askmerge'){askMerge();return}
  if(a==='reveal'){train.rev=true;renderTrain();var an=document.getElementById('tans');if(an)an.focus({preventScroll:true});return}
  if(a==='tskip'){trainNext();renderTrain();var q=document.getElementById('tq');if(q)q.focus({preventScroll:true});return}
  if(a==='tknow'||a==='treview'){var p=prog();p[train.cur.id]=a==='tknow'?1:2;setProg(p);trainNext();renderTrain();var q2=document.getElementById('tq');if(q2)q2.focus({preventScroll:true});return}
  if(a==='treset'){setProg({});train.queue=[];trainNext();renderTrain();return}
  if(a==='pnext'){presGo(1);return}
  if(a==='pprev'){presGo(-1);return}
  if(a==='preveal'){presReveal();return}
  if(a==='pplus'||a==='pminus'){state.pfs=Math.max(.7,Math.min(1.8,+(state.pfs+(a==='pplus'?.15:-.15)).toFixed(2)));store.set('jd-pfs',String(state.pfs));renderPresent();return}
  if(a==='pbi'){state.bi=!state.bi;store.set('jd-bi',state.bi?'1':'0');renderPresent();return}
});
main.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='biChk'){state.bi=t.checked;store.set('jd-bi',state.bi?'1':'0');var op=[];var ds=main.querySelectorAll('details.q[open]');for(var i=0;i<ds.length;i++)op.push(ds[i].getAttribute('data-id'));var fl=main.querySelector('[data-filter][aria-pressed=true]');route2(op,fl&&fl.getAttribute('data-filter'));}
  else if(t.id==='tScope'){train.scope=t.value;train.queue=[];train.cur=null;trainNext();renderTrain()}
  else if(t.id==='tOnly'){train.only=t.checked;train.queue=[];train.cur=null;trainNext();renderTrain()}
});
/* إعادة الرسم مع حفظ المفتوح والتصفية */
function route2(open,filter){
  var y=window.scrollY,p=parse(),keep=document.activeElement&&document.activeElement.id;
  var r=route_noscroll();
  var ds=main.querySelectorAll('details.q');for(var i=0;i<ds.length;i++)if(open.indexOf(ds[i].getAttribute('data-id'))>-1)ds[i].open=true;
  if(filter&&filter!=='all'){var b=main.querySelector('[data-filter="'+filter+'"]');if(b){var all=main.querySelectorAll('[data-filter]');for(var j=0;j<all.length;j++)all[j].setAttribute('aria-pressed',all[j]===b?'true':'false');applyFilter(filter)}}
  window.scrollTo(0,y);
  var c=keep&&document.getElementById(keep);if(c)c.focus({preventScroll:true});
}
function route_noscroll(){
  var p=parse();
  switch(p[0]){
    case 'c':return viewCluster(p[1]);
    case 'q':return viewCluster((byId[p[1]]||{}).c||'');
    case 'search':return viewSearch(p.slice(1).join('/'));
    case 'faq':return viewFaq();
    case 'asked':return viewAsked();
    default:return route();
  }
}
document.getElementById('langBtn').addEventListener('click',function(){
  state.lang=state.lang==='ar'?'en':'ar';store.set('jd-lang',state.lang);applyChrome();
  var y=window.scrollY;route_noscroll();window.scrollTo(0,y);
});
document.getElementById('themeBtn').addEventListener('click',function(){
  var n=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);store.set('jd-theme',n);syncThemeIcon();
});
document.getElementById('printBtn').addEventListener('click',openPrint);
document.getElementById('pCancel').addEventListener('click',function(){var d=document.getElementById('printDlg');if(d.close)d.close();else d.removeAttribute('open')});
document.getElementById('pform').addEventListener('submit',function(){setTimeout(doPrint,80)});
window.addEventListener('hashchange',route);
if(window.matchMedia)try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeIcon)}catch(e){}

applyChrome();
route();
})();
</script>
