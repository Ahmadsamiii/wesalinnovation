<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>وصال | شاشة الجناح</title>
<meta name="theme-color" content="#20134f">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="preload" href="/fonts/thmanyahsans-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Bold.woff2') format('woff2');font-weight:600 800;font-style:normal;font-display:swap}
/* ألوان دليل الهوية البصرية فقط */
:root{--primary:#282692;--secondary:#814fc3;--tertiary:#5039a8;--deep:#20134f;--blue:#3e9eed;--sky:#52bdf9;--ink:#20134f;--line:#dddceb;
  /* وحدة التصميم: بكسل واحد على شاشة 1920x1080، وتكبر وتصغر مع الشاشة كلها */
  --u:min(100vw / 1920, 100vh / 1080)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Thmanyah Sans','Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;color:#fff;background:linear-gradient(150deg,#20134f 0%,#282692 48%,#5039a8 100%);overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}
[hidden]{display:none!important}
.arcs{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
.arcs i{position:absolute;border-radius:50%;border:calc(var(--u)*2.5) solid #814fc3;opacity:.5}
.arcs i:nth-child(1){width:calc(var(--u)*2300);height:calc(var(--u)*2300);right:calc(var(--u)*-1500);top:calc(var(--u)*-560);animation:drift 26s ease-in-out infinite alternate}
.arcs i:nth-child(2){width:calc(var(--u)*1700);height:calc(var(--u)*1700);left:calc(var(--u)*-1050);bottom:calc(var(--u)*-900);border-color:#52bdf9;opacity:.34;animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(calc(var(--u)*40),calc(var(--u)*-30))}}

.stage{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;grid-template-columns:calc(var(--u)*700) calc(var(--u)*940);column-gap:calc(var(--u)*70);align-items:center;justify-content:center;padding:calc(var(--u)*50) calc(var(--u)*60) calc(var(--u)*92)}
.txt{height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:calc(var(--u)*10) 0 0}
.brand{display:flex;align-items:center;gap:calc(var(--u)*22);direction:ltr}
.brand .wm{height:calc(var(--u)*76);width:auto}
.brand .sp{width:calc(var(--u)*2);height:calc(var(--u)*60);background:rgba(255,255,255,.55)}
.brand .mk{height:calc(var(--u)*112);width:auto}

.count{width:100%}
.lbl{font-size:calc(var(--u)*46);font-weight:700;line-height:1.3;color:#fff}
.big{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*330);font-weight:800;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;text-shadow:0 calc(var(--u)*14) calc(var(--u)*50) rgba(15,8,50,.45)}
.big.tick{animation:tick .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes tick{0%{transform:scale(.9);opacity:.5}100%{transform:none;opacity:1}}
.dots{display:flex;gap:calc(var(--u)*9);margin-top:calc(var(--u)*34);direction:ltr}
.dots i{flex:1;max-width:calc(var(--u)*24);height:calc(var(--u)*24);border-radius:50%;background:rgba(255,255,255,.22);transition:background .4s,transform .4s}
.dots i.on{background:#fff}
.dots i.cur{background:var(--sky);transform:scale(1.28);box-shadow:0 0 0 calc(var(--u)*6) rgba(82,189,249,.32)}
.lap{margin-top:calc(var(--u)*22);font-size:calc(var(--u)*34);font-weight:700;line-height:1.5}

.cta{position:relative;display:flex;align-items:center;gap:calc(var(--u)*26);width:100%;min-height:calc(var(--u)*128);padding:calc(var(--u)*18) calc(var(--u)*34);border-radius:calc(var(--u)*70);border:calc(var(--u)*2.5) solid rgba(255,255,255,.55);background:rgba(255,255,255,.08)}
.cta p{font-size:calc(var(--u)*38);font-weight:700;line-height:1.45}
.cta .why{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*30);font-weight:400;opacity:.88}
.nfc{position:relative;flex:none;width:calc(var(--u)*92);height:calc(var(--u)*92);display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--primary)}
.nfc svg{width:calc(var(--u)*50);height:calc(var(--u)*50);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nfc i{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border:calc(var(--u)*3) solid rgba(255,255,255,.7);opacity:0;animation:wave 2.8s ease-out infinite}
.nfc i:nth-child(2){animation-delay:.9s}.nfc i:nth-child(3){animation-delay:1.8s}
@keyframes wave{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
.win{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:center;padding:0 calc(var(--u)*44);border-radius:calc(var(--u)*70);background:linear-gradient(120deg,#52bdf9,#3e9eed);color:var(--deep);animation:winin .7s cubic-bezier(.2,1.2,.3,1) both}
.win .w1{font-size:calc(var(--u)*52);font-weight:800;line-height:1.3}
.win .w2{font-size:calc(var(--u)*34);font-weight:700;line-height:1.4}
@keyframes winin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

.board{position:relative}
.card{position:relative;padding:calc(var(--u)*62) calc(var(--u)*66);border-radius:calc(var(--u)*56);background:#fff;box-shadow:0 calc(var(--u)*60) calc(var(--u)*110) calc(var(--u)*-50) rgba(10,5,40,.85);animation:float 9s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(calc(var(--u)*-10))}}
.foot{position:fixed;left:0;right:0;bottom:calc(var(--u)*30);text-align:center;font-size:calc(var(--u)*25);line-height:1.6;opacity:.82;padding:0 calc(var(--u)*60)}
.stat{position:fixed;left:calc(var(--u)*24);bottom:calc(var(--u)*24);width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;background:#52bdf9;opacity:.5}
.stat.bad{background:#ffffff;opacity:.25}

@media (orientation:portrait){
  :root{--u:min(100vw / 1080, 100vh / 1920)}
  .stage{grid-template-columns:calc(var(--u)*960);grid-template-rows:auto auto auto;row-gap:calc(var(--u)*56);align-content:center;padding:calc(var(--u)*70) calc(var(--u)*60) calc(var(--u)*110)}
  .txt{display:contents}
  .brand{order:1;justify-content:center;width:100%}
  .board{order:2}
  .count{order:3;text-align:center}
  .big{text-align:center;font-size:calc(var(--u)*300)}
  .dots{justify-content:center}
  .cta{order:4}
  .stage{grid-template-rows:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="arcs" aria-hidden="true"><i></i><i></i></div>

<main class="stage">
  <section class="txt">
    <div class="brand" role="img" aria-label="شعار وصال">
      <img class="wm" src="/assets/hello-word-white.png" alt="" width="831" height="471">
      <span class="sp" aria-hidden="true"></span>
      <img class="mk" src="/assets/hello-mark-white.png" alt="" width="1130" height="814">
    </div>

    <div class="count">
      <p class="lbl">زوار جناح وصال</p>
      <p class="big" id="big" aria-live="polite">0</p>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <p class="lap" id="lap"></p>
    </div>

    <div class="cta" id="cta">
      <span class="nfc" aria-hidden="true"><i></i><i></i><i></i><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M11 18.5h2"/></svg></span>
      <div class="ctat"><p>قرّبوا جوالكم من بطاقة وصال، وركّبوا قطعتكم</p><p class="why">لأن الشعار ما يكمل إلا بكم</p></div>
      <div class="win" id="win" hidden><p class="w1" id="w1"></p><p class="w2" id="w2"></p></div>
    </div>
  </section>

  <section class="board">
    <div class="card"><div id="host"></div></div>
  </section>
</main>

<p class="foot">من فعاليات المؤتمر الدولي السابع لذوي الإعاقة، تحت الرعاية الكريمة لخادم الحرمين الشريفين الملك سلمان بن عبدالعزيز</p>
<i class="stat" id="stat" aria-hidden="true"></i>

<script src="/assets/hello-puzzle.js"></script>
<script>
(function(){
'use strict';
var P=window.WesalPuzzle,COUNT=P.COUNT,reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function $(s){return document.querySelector(s);}
var big=$('#big'),dotsEl=$('#dots'),lapEl=$('#lap'),win=$('#win'),w1=$('#w1'),w2=$('#w2'),stat=$('#stat');
var board=P.mount($('#host'));
board.label('لوحة شعار وصال تتركب قطعة قطعة مع كل زائر');
P.preload(true);

var dots=[];
for(var i=0;i<COUNT;i++){var d=document.createElement('i');dotsEl.appendChild(d);dots.push(d);}
function setDots(k){dots.forEach(function(d,i){d.className=i<k?(i===k-1?'on cur':'on'):'';});}
function setLap(n){
  lapEl.textContent=n?'الشعار رقم '+P.lapOf(n):'حيّاكم الله، بانتظار أول زائر';
}
function setNumber(n,pop){
  big.textContent=String(n);
  if(pop){big.classList.remove('tick');void big.offsetWidth;big.classList.add('tick');}
}

var st={target:null,busy:false,queue:[],winTimer:0};
function renderInstant(n){
  board.clear(false);
  var k=n?P.pieceOf(n):0;
  if(k===COUNT)board.complete();else board.fill(k,false);
  setNumber(n,false);setDots(k);setLap(n);
}
function banner(n){
  clearTimeout(st.winTimer);
  w1.textContent='اكتمل الشعار رقم '+P.lapOf(n);
  w2.textContent='رقم '+n+' كمّله، مبروك!';
  win.hidden=false;
  st.winTimer=setTimeout(function(){win.hidden=true;},5200);
}
function run(){
  if(st.busy||!st.queue.length)return;
  st.busy=true;
  var n=st.queue.shift(),k=P.pieceOf(n),fast=st.queue.length>3;
  function next(){st.busy=false;setTimeout(run,reduce?0:450);}
  function go(){
    setNumber(n,true);setDots(k);setLap(n);
    if(fast){board.fill(k,false);if(k===COUNT)board.complete();next();return;}
    board.land(k,{num:n,hero:.3,done:function(){
      if(k===COUNT){banner(n);board.celebrate({big:true,done:next});}else next();
    }});
  }
  /* أول قطعة من شعار جديد: يختفي الشعار المكتمل ثم نبدأ */
  if(k===1&&board.count()>0){win.hidden=true;board.clear(true,go);}else go();
}
function sync(n){
  if(st.target===null||n<st.target){st.target=n;st.queue=[];renderInstant(n);return;}
  for(var i=st.target+1;i<=n;i++)st.queue.push(i);
  st.target=n;run();
}

/* الأرقام من الخادم فقط، ولا يُختلق رقم أبداً: عند تعذّر القراءة تبقى آخر لوحة معروضة */
(function poll(){
  fetch('/api/hello-visit.php',{cache:'no-store',credentials:'omit'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){var ok=!!(j&&j.ok&&j.n>=0);stat.classList.toggle('bad',!ok);if(ok)sync(parseInt(j.n,10)||0);})
    .catch(function(){stat.classList.add('bad');})
    .then(function(){setTimeout(poll,2500);});
})();
/* وقت الهدوء: لمعة خفيفة كل 24 ثانية */
setInterval(function(){if(!st.busy&&!st.queue.length)board.wave();},24000);
})();
</script>
</body>
</html>
