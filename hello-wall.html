<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>وصال | شاشة الجناح</title>
<meta name="theme-color" content="#20134f">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="preload" href="/fonts/thmanyahsans-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('/fonts/thmanyahsans-Bold.woff2') format('woff2');font-weight:600 800;font-style:normal;font-display:swap}
/* ألوان دليل الهوية البصرية فقط */
:root{--primary:#282692;--secondary:#814fc3;--tertiary:#5039a8;--deep:#20134f;--blue:#3e9eed;--sky:#52bdf9;
  /* وحدة التصميم: بكسل واحد على شاشة 1920x1080، وتكبر وتصغر مع الشاشة كلها */
  --u:min(100vw / 1920, 100vh / 1080);--cw:850}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Thmanyah Sans','Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;color:#fff;background:linear-gradient(150deg,#20134f 0%,#282692 48%,#5039a8 100%);overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}

/* خلفية بعمق: ضوءان كبيران يتحرّكان ببطء، وجزيئات خفيفة تصعد، وتعتيم هادئ عند الأطراف */
.bg{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
.bg .lt{position:absolute;border-radius:50%;will-change:transform}
.bg .l1{width:calc(var(--u)*1500);height:calc(var(--u)*1500);left:calc(var(--u)*-520);top:calc(var(--u)*-600);background:radial-gradient(closest-side,rgba(129,79,195,.5),rgba(129,79,195,0));animation:drift 34s ease-in-out infinite alternate}
.bg .l2{width:calc(var(--u)*1400);height:calc(var(--u)*1400);right:calc(var(--u)*-480);bottom:calc(var(--u)*-640);background:radial-gradient(closest-side,rgba(82,189,249,.34),rgba(82,189,249,0));animation:drift 40s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(calc(var(--u)*70),calc(var(--u)*-50))}}
.bg .motes i{position:absolute;bottom:calc(var(--u)*-40);border-radius:50%;opacity:0;will-change:transform,opacity;animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translate3d(0,0,0)}12%{opacity:var(--o)}86%{opacity:var(--o)}100%{opacity:0;transform:translate3d(var(--dx),calc(var(--u)*-1200),0)}}
.bg::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(120% 105% at 50% 40%,rgba(8,4,34,0) 58%,rgba(8,4,34,.55) 100%)}

/* لوحة الشعار في المنتصف وتحتها العبارة والعدّاد، كلها على محور واحد */
.stage{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*28);padding:calc(var(--u)*30) calc(var(--u)*60)}
.cardwrap{position:relative}

/* الهالة خلف اللوحة: توهّج يتنفّس، وحلقات رقيقة، ونقطة تدور على إحداها.
   كل عنصر يُثبَّت عند نقطة الأصل صراحةً، فلا يزيحه اتجاه الصفحة من اليمين لليسار */
.halo{position:absolute;left:50%;top:50%;width:0;height:0;z-index:-1;pointer-events:none}
.halo i{position:absolute;left:0;top:0;border-radius:50%;display:block}
.halo .glow{width:calc(var(--u)*1700);height:calc(var(--u)*1700);margin:calc(var(--u)*-850) 0 0 calc(var(--u)*-850);background:radial-gradient(closest-side,rgba(129,79,195,.72),rgba(80,57,168,.32) 50%,rgba(80,57,168,0));animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.72;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}
.halo .ring{border:calc(var(--u)*2) solid rgba(255,255,255,.12)}
.halo .r1{width:calc(var(--u)*1260);height:calc(var(--u)*1260);margin:calc(var(--u)*-630) 0 0 calc(var(--u)*-630)}
.halo .r2{width:calc(var(--u)*1680);height:calc(var(--u)*1680);margin:calc(var(--u)*-840) 0 0 calc(var(--u)*-840);border-color:rgba(255,255,255,.085)}
.halo .r3{width:calc(var(--u)*2140);height:calc(var(--u)*2140);margin:calc(var(--u)*-1070) 0 0 calc(var(--u)*-1070);border-color:rgba(255,255,255,.055)}
.halo .orbit{width:calc(var(--u)*1680);height:calc(var(--u)*1680);margin:calc(var(--u)*-840) 0 0 calc(var(--u)*-840);animation:spin 56s linear infinite}
.halo .orbit b{position:absolute;left:50%;top:0;width:calc(var(--u)*16);height:calc(var(--u)*16);margin:calc(var(--u)*-8) 0 0 calc(var(--u)*-8);border-radius:50%;background:#c4e8ff;box-shadow:0 0 calc(var(--u)*26) calc(var(--u)*7) rgba(82,189,249,.75)}
@keyframes spin{to{transform:rotate(360deg)}}
.halo .pulse{width:calc(var(--u)*1500);height:calc(var(--u)*1500);margin:calc(var(--u)*-750) 0 0 calc(var(--u)*-750);background:radial-gradient(closest-side,rgba(140,205,255,.6),rgba(140,205,255,0));opacity:0}
.halo .ripple{width:calc(var(--u)*900);height:calc(var(--u)*900);margin:calc(var(--u)*-450) 0 0 calc(var(--u)*-450);border:calc(var(--u)*5) solid rgba(190,232,255,.8);box-shadow:0 0 calc(var(--u)*50) rgba(120,200,255,.55),inset 0 0 calc(var(--u)*50) rgba(120,200,255,.35);opacity:0}
.halo .rays{width:calc(var(--u)*2300);height:calc(var(--u)*2300);margin:calc(var(--u)*-1150) 0 0 calc(var(--u)*-1150);opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.26) 0deg 5deg,rgba(255,255,255,0) 5deg 15deg);-webkit-mask-image:radial-gradient(closest-side,rgba(0,0,0,.95),rgba(0,0,0,0) 74%);mask-image:radial-gradient(closest-side,rgba(0,0,0,.95),rgba(0,0,0,0) 74%)}

.card{position:relative;width:calc(var(--u)*var(--cw));padding:calc(var(--u)*52) calc(var(--u)*58);border:calc(var(--u)*4) solid transparent;border-radius:calc(var(--u)*56);background:linear-gradient(#fff,#fff) padding-box,linear-gradient(140deg,#814fc3,#52bdf9) border-box;box-shadow:0 calc(var(--u)*56) calc(var(--u)*100) calc(var(--u)*-44) rgba(8,4,36,.9),0 0 calc(var(--u)*90) rgba(129,79,195,.4);animation:float 9s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(calc(var(--u)*-10))}}

/* العبارة فوق العدّاد، وكلاهما على محور المنتصف. --k يصغّر العدّاد وحده إن زادت خاناته على عرض الشاشة */
.counter{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*24);line-height:1}
.cap{font-size:calc(var(--u)*48);font-weight:600;line-height:1.3;text-align:center;color:rgba(255,255,255,.94);text-shadow:0 calc(var(--u)*3) calc(var(--u)*16) rgba(8,4,36,.6)}
/* العدّاد في وسط الشبكة تماماً، وكلمة «زائر» في الخانة المجاورة له وعلى منتصفه رأسياً */
.num{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:calc(var(--u)*34*var(--k,1));direction:ltr}
.unit{grid-column:1;grid-row:1;justify-self:end;direction:rtl;white-space:nowrap;line-height:1;padding-bottom:calc(var(--u)*16*var(--k,1));font-size:calc(var(--u)*88*var(--k,1));font-weight:700;color:var(--sky);text-shadow:0 0 calc(var(--u)*30) rgba(82,189,249,.55)}

/* العدّاد: كل خانة لوح زجاجي فيه شريط أرقام يدور إلى رقمه الجديد */
.odo{grid-column:2;grid-row:1;display:inline-flex;direction:ltr;gap:calc(var(--u)*14*var(--k,1));height:1em;font-size:calc(var(--u)*180*var(--k,1));font-weight:800;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums}
.odo .col{position:relative;display:block;height:1em;padding:0 .085em;border-radius:.17em;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07));box-shadow:inset 0 0 0 calc(var(--u)*2) rgba(255,255,255,.24),0 calc(var(--u)*22) calc(var(--u)*44) calc(var(--u)*-20) rgba(8,4,36,.7);text-shadow:0 0 .22em rgba(82,189,249,.5)}
.odo .col::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;background:radial-gradient(closest-side,rgba(110,200,255,.7),rgba(110,200,255,0));opacity:0;pointer-events:none}
.odo .col.chg::before{animation:tile .95s ease-out}
@keyframes tile{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
.odo .win{display:block;height:1em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 85%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 85%,transparent 100%)}
.odo .strip{display:block;will-change:transform}
.odo .strip i{display:block;height:1em;line-height:1em;font-style:normal;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stat{position:fixed;left:calc(var(--u)*24);bottom:calc(var(--u)*24);width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;background:#52bdf9;opacity:.5}
.stat.bad{background:#ffffff;opacity:.25}

@media (orientation:portrait){
  :root{--u:min(100vw / 1080, 100vh / 1920);--cw:960}
  .stage{gap:calc(var(--u)*60)}
  .cap{font-size:calc(var(--u)*64)}
  .odo{font-size:calc(var(--u)*290*var(--k,1))}
  .unit{font-size:calc(var(--u)*120*var(--k,1))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="lt l1"></i><i class="lt l2"></i><div class="motes" id="motes"></div></div>

<main class="stage" id="stage" aria-label="شاشة جناح وصال">
  <div class="cardwrap">
    <div class="halo" id="halo" aria-hidden="true">
      <i class="glow"></i><i class="rays" id="rays"></i><i class="pulse" id="pulse"></i>
      <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
      <i class="orbit"><b></b></i>
    </div>
    <div class="card"><div id="host"></div></div>
  </div>
  <section class="counter" id="counter">
    <h1 class="cap">عدد زوار جناح وصال</h1>
    <p class="num" id="num" aria-live="polite">
      <span class="sr" id="bigtxt">0 زائر</span>
      <span class="odo" id="odo" aria-hidden="true"></span>
      <span class="unit" id="unit" aria-hidden="true">زائر</span>
    </p>
  </section>
</main>

<i class="stat" id="stat" aria-hidden="true"></i>

<script src="/assets/hello-puzzle.js"></script>
<script>
(function(){
'use strict';
var P=window.WesalPuzzle,COUNT=P.COUNT,reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function $(s){return document.querySelector(s);}
var odoEl=$('#odo'),unitEl=$('#unit'),numEl=$('#num'),counterEl=$('#counter'),stageEl=$('#stage'),bigtxt=$('#bigtxt'),stat=$('#stat'),
    halo=$('#halo'),pulseEl=$('#pulse'),raysEl=$('#rays');
var board=P.mount($('#host'));
board.label('لوحة شعار وصال تتركب قطعة قطعة مع كل زائر');
P.preload(true);

/* الجزيئات: موضعها وحجمها ولونها من مولّد ثابت، فتبدو الشاشة نفسها كل مرة */
(function(){
  if(reduce)return;
  var box=$('#motes'),seed=7,cols=['#ffffff','#52bdf9','#c9a8ff','#ffffff','#7fd0ff'];
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  for(var i=0;i<22;i++){
    var d=document.createElement('i'),sz=5+rnd()*10,dur=24+rnd()*22;
    d.style.cssText='left:'+(rnd()*100).toFixed(1)+'%;width:calc(var(--u)*'+sz.toFixed(1)+');height:calc(var(--u)*'+sz.toFixed(1)+');background:'+cols[i%cols.length]+
      ';--o:'+(0.16+rnd()*0.32).toFixed(2)+';--dx:calc(var(--u)*'+((rnd()-0.5)*220).toFixed(0)+');animation-duration:'+dur.toFixed(1)+'s;animation-delay:-'+(rnd()*dur).toFixed(1)+'s';
    box.appendChild(d);
  }
})();

/* العدّاد: شريط من 0 إلى 9 ثم 0 مكرر، فيدور الرقم 9 إلى 0 للأمام كالعدّادات الحقيقية */
var cols=[],shown='';
function buildCols(len){
  odoEl.textContent='';cols=[];
  for(var i=0;i<len;i++){
    var col=document.createElement('span'),win=document.createElement('span'),strip=document.createElement('span');
    col.className='col';win.className='win';strip.className='strip';
    for(var d=0;d<11;d++){var cell=document.createElement('i');cell.textContent=String(d%10);strip.appendChild(cell);}
    win.appendChild(strip);col.appendChild(win);odoEl.appendChild(col);cols.push({col:col,strip:strip,d:0});
  }
  shown='';
}
/* إن زادت خانات العدّاد على عرض الشاشة (آلاف الزوار على شاشة عمودية مثلاً) يصغر وحده، فيبقى في المنتصف ولا يُقصّ */
function fit(){
  counterEl.style.setProperty('--k','1');
  var avail=innerWidth-2*(parseFloat(getComputedStyle(stageEl).paddingLeft)||0),
      need=odoEl.offsetWidth+2*(unitEl.offsetWidth+(parseFloat(getComputedStyle(numEl).columnGap)||0));
  if(need>avail)counterEl.style.setProperty('--k',Math.max(0.3,avail/need*0.97).toFixed(3));
}
function setNumber(n,animate){
  var s=String(n),first=false;
  if(s.length!==cols.length){buildCols(s.length);fit();first=true;}
  animate=animate&&!first&&!reduce;
  cols.forEach(function(c,i){
    var nd=parseInt(s.charAt(i),10);
    if(nd===c.d&&shown!=='')return;
    var wrap=animate&&nd===0&&c.d>0,target=wrap?10:nd;
    c.strip.style.transition=animate?'transform .9s cubic-bezier(.2,.8,.2,1)':'none';
    c.strip.style.transform='translateY(-'+target+'em)';
    if(wrap)setTimeout(function(){c.strip.style.transition='none';c.strip.style.transform='translateY(0)';},960);
    if(animate){c.col.classList.add('chg');setTimeout(function(){c.col.classList.remove('chg');},1000);}
    c.d=nd;
  });
  if(animate&&odoEl.animate)odoEl.animate([{transform:'scale(1)'},{transform:'scale(1.045)',offset:.3},{transform:'scale(1)'}],{duration:900,easing:'ease-out'});
  shown=s;
  bigtxt.textContent=s+' زائر';
}
setNumber(0,false);
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* موجة ضوء تتّسع من قلب اللوحة عند وصول كل زائر، وعند الاكتمال ثلاث موجات وأشعّة */
function ripple(delay,big){
  if(reduce||!halo.animate)return;
  var r=document.createElement('i');r.className='ripple';halo.appendChild(r);
  var a=r.animate([{transform:'scale(.55)',opacity:big?.95:.75},{transform:'scale(2.7)',opacity:0}],
    {duration:big?2600:2000,delay:delay||0,easing:'cubic-bezier(.2,.6,.3,1)',fill:'both'});
  a.onfinish=function(){r.parentNode&&r.parentNode.removeChild(r);};
}
function glowPulse(big){
  if(reduce||!pulseEl.animate)return;
  pulseEl.animate([{opacity:0,transform:'scale(.8)'},{opacity:big?1:.75,transform:'scale(1.02)',offset:.3},{opacity:0,transform:'scale(1.12)'}],
    {duration:big?2800:1800,easing:'ease-out'});
}
function arrive(){ripple(0,false);glowPulse(false);}
function burst(){
  ripple(0,true);ripple(380,true);ripple(760,true);glowPulse(true);
  if(!reduce&&raysEl.animate)raysEl.animate([{opacity:0,transform:'rotate(0deg) scale(.7)'},{opacity:1,offset:.25},{opacity:0,transform:'rotate(34deg) scale(1.08)'}],{duration:4800,easing:'ease-in-out'});
}

var st={target:null,busy:false,queue:[]};
function renderInstant(n){
  board.clear(false);
  var k=n?P.pieceOf(n):0;
  if(k===COUNT)board.complete();else board.fill(k,false);
  setNumber(n,false);
}
function run(){
  if(st.busy||!st.queue.length)return;
  st.busy=true;
  var n=st.queue.shift(),k=P.pieceOf(n),fast=st.queue.length>3;
  function next(){st.busy=false;setTimeout(run,reduce?0:450);}
  function go(){
    setNumber(n,true);
    if(fast){board.fill(k,false);if(k===COUNT)board.complete();next();return;}
    board.land(k,{num:n,hero:.3,done:function(){
      arrive();
      if(k===COUNT){setTimeout(burst,reduce?0:1320);board.celebrate({big:true,done:next});}else next();
    }});
  }
  /* أول قطعة من شعار جديد: يختفي الشعار المكتمل ثم نبدأ */
  if(k===1&&board.count()>0)board.clear(true,go);else go();
}
function sync(n){
  if(st.target===null||n<st.target){st.target=n;st.queue=[];renderInstant(n);return;}
  for(var i=st.target+1;i<=n;i++)st.queue.push(i);
  st.target=n;run();
}

/* الأرقام من الخادم فقط، ولا يُختلق رقم أبداً: عند تعذّر القراءة تبقى آخر لوحة معروضة */
(function poll(){
  fetch('/api/hello-visit.php',{cache:'no-store',credentials:'omit'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){var ok=!!(j&&j.ok&&j.n>=0);stat.classList.toggle('bad',!ok);if(ok)sync(parseInt(j.n,10)||0);})
    .catch(function(){stat.classList.add('bad');})
    .then(function(){setTimeout(poll,2500);});
})();
/* وقت الهدوء: لمعة خفيفة كل 24 ثانية */
setInterval(function(){if(!st.busy&&!st.queue.length)board.wave();},24000);
})();
</script>
</body>
</html>
